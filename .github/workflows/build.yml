name: Build Mod
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Official Fabric Template
        run: |
          git clone --depth=1 https://github.com/fabricmc/fabric-example-mod.git template
          rm -rf template/.git
          rm -rf template/src

      - name: Merge Source Code
        run: |
          cp -r src template/
          mv template/* . || true
          mv template/.* . || true
          rm -rf template

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Mod with Gradle
        run: chmod +x gradlew && ./gradlew build
